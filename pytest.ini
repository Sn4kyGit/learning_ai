[tool:pytest]
# Pytest configuration for comprehensive testing

# Test discovery
testpaths = backend/tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Async configuration
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Markers
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (API endpoints)
    e2e: End-to-end tests (complete workflows)
    performance: Performance and load tests
    slow: Tests that take more than 5 seconds
    deployment: Deployment tests
    requires_docker: Tests that require Docker
    requires_redis: Tests that require Redis
    requires_postgres: Tests that require PostgreSQL
    external: Tests that require external services

# Output options
addopts = 
    --strict-markers
    --strict-config
    --tb=short
    --maxfail=10
    --durations=10
    --color=yes
    --cov=backend
    --cov-report=html:htmlcov
    --cov-report=term-missing
    --cov-report=xml
    --cov-fail-under=80
    -v

# Warning filters
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore:.*unclosed.*:ResourceWarning
    ignore:.*coroutine.*was never awaited:RuntimeWarning
    ignore:.*datetime.datetime.utcnow.*:DeprecationWarning
    ignore:.*pkg_resources.*:DeprecationWarning
    ignore:.*imp module.*:DeprecationWarning
    ignore:.*distutils.*:DeprecationWarning
    error::UserWarning
    error::FutureWarning

# Coverage options
[coverage:run]
source = backend
branch = True
parallel = True
omit = 
    backend/tests/*
    backend/migrations/*
    backend/alembic/*
    backend/conftest.py
    */venv/*
    */env/*
    */__pycache__/*
    */test_*.py
    *_test.py
    backend/main.py
    backend/create_admin.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    def __str__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if False:
    if __name__ == .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod
    @abstractmethod
    # Type checking imports
    if TYPE_CHECKING:
    # Defensive assertions
    assert False
    # Platform specific code
    if sys.platform

show_missing = True
precision = 2
fail_under = 80
skip_covered = False
skip_empty = True
sort = Cover

[coverage:html]
directory = htmlcov
title = Local Business Intelligence Bot Coverage Report
show_contexts = True

[coverage:xml]
output = coverage.xml

[coverage:json]
output = coverage.json
show_contexts = True